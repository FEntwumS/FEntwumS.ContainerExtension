name: Bug Report (Production-Ready)
description: Create a report to help us improve the Container Extension
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! 
        **Security Notice:** If this issue involves a security vulnerability (e.g., container escape, credential leakage, network exfiltration), please refer to our [SECURITY.md](../SECURITY.md) and report it privately.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: To Reproduce
      description: Steps to reproduce the behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Host Environment
      placeholder: e.g. Windows 11 23H2, macOS ARM Sonoma, Ubuntu 24.04 LTS
    validations:
      required: true
  - type: dropdown
    id: daemon
    attributes:
      label: Container Engine
      options:
        - Docker Desktop
        - Podman (Rootless)
        - Colima
        - Rancher Desktop
        - OrbStack
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OneWare Studio / Extension Version
      placeholder: e.g. Studio 1.2.0 / Extension 1.0.0
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Execution Telemetry & Security Context
      description: Paste relevant `jsonl` logs or screenshots here. Ensure no sensitive tokens are included.
