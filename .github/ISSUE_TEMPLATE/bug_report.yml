name: Bug Report
description: Create a report to help us improve the Container Extension
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please provide as much detail as possible to help us resolve the issue efficiently.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: To Reproduce
      description: Steps to reproduce the behavior.
      value: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      description: What operating system are you using?
      placeholder: e.g. Windows 11, macOS ARM, Ubuntu 24.04
    validations:
      required: true
  - type: dropdown
    id: daemon
    attributes:
      label: Docker Daemon
      description: What container daemon are you using?
      options:
        - Docker Desktop
        - Podman
        - Colima
        - Rancher Desktop
        - OrbStack
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OneWare Studio Version
      placeholder: e.g. 1.2.0
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add any other context about the problem, or logs, here.
