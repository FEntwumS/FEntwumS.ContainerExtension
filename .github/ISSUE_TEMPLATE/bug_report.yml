name: Bug Report
description: Create a report to help us improve the Container Extension
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Provide the following details so the issue can be reproduced.
        **Security notice:** if this involves a vulnerability (container escape, credential leakage, network exfiltration), do not file it here; follow the private process in [SECURITY.md](https://github.com/FEntwumS/FEntwumS.ContainerExtension/blob/main/.github/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: To Reproduce
      description: Steps to reproduce the behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Host Environment
      placeholder: e.g. Windows 11 23H2, macOS ARM Sonoma, Ubuntu 24.04 LTS
    validations:
      required: true
  - type: dropdown
    id: daemon
    attributes:
      label: Container Engine
      options:
        - Docker Desktop
        - Podman (Rootless)
        - Colima
        - Rancher Desktop
        - OrbStack
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OneWare Studio / Extension Version
      placeholder: e.g. Studio 1.2.0 / Extension 1.0.0
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Execution Telemetry & Security Context
      description: Paste relevant `jsonl` logs or screenshots here. Ensure no sensitive tokens are included.
