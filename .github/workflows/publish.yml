name: Publish Secure Release

on:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write      # Required for OIDC artifact attestation (SLSA)
      attestations: write
    steps:
      # No submodules: this job builds src/ContainerExtension only, and the one path it takes from
      # docker/ is the Dockerfile, which is tracked here rather than in the toolchain submodule.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/global.json', '**/Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj', '**/packages.lock.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Resolve release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Derive the version from the published release tag (falling back to the ref for a manual
          # workflow_dispatch), never from the project <Version>, so the artifact name, attestation
          # subject, and release tag always match the release actually being published.
          #
          # A manual run exists to publish an existing release again, so it must be started from
          # that release's tag. Started from a branch, the fallback would name the version after the
          # branch, and the release step would create a release and a tag of that name.
          if [ "$EVENT_NAME" != "release" ] && [ "$REF_TYPE" != "tag" ]; then
            echo "::error::A manual run must be started from a release tag, not from a branch."
            exit 1
          fi
          version="${RELEASE_TAG:-$REF_NAME}"
          # Release tags in this repository are MAJOR.MINOR.PATCH with no prefix, such as 1.2.1.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The version '${version}' is not a release tag of the form MAJOR.MINOR.PATCH."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build Release Bundle (locked restore)
        run: dotnet build src/ContainerExtension/ContainerExtension.csproj -c Release -o publish -warnaserror -p:RestoreLockedMode=true
        env:
          GITHUB_ACTIONS: true

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ./publish
          format: spdx-json
          output-file: publish/sbom.spdx.json
          # The release step below attaches publish/sbom.spdx.json. The action's own release upload
          # would fetch its workflow artifact back and attach the same SBOM again under another name.
          upload-release-assets: false

      # zip ships on the runner. Shelling out keeps a third-party action out of the release job,
      # which is the one holding contents, id-token and attestations write. The version travels via
      # env rather than ${{ }} interpolation so a tag can never be substituted into the command.
      - name: Compress Release Artifacts
        working-directory: ./publish
        run: zip -r "../ContainerExtension_${VERSION}_all.zip" .
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Generate SLSA Build Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ContainerExtension_${{steps.version.outputs.version}}_all.zip

      - name: Publish to GitHub Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          artifacts: "ContainerExtension_${{steps.version.outputs.version}}_all.zip,./publish/compatibility.txt,./publish/sbom.spdx.json"
          tag: ${{steps.version.outputs.version}}
          allowUpdates: true
