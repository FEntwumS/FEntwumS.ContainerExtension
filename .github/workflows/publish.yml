name: Publish Secure Release

on:
  workflow_dispatch:
  release:
    types:
      - published

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write      # Required for OIDC artifact attestation (SLSA)
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Get Version
        uses: kzrnm/get-net-sdk-project-versions-action@v1.3.0
        id: get-version
        with:
          proj-path: src/ContainerExtension/ContainerExtension.csproj

      - name: Build Release Bundle
        run: dotnet build src/ContainerExtension/ContainerExtension.csproj -c Release -o publish -warnaserror
        env:
          GITHUB_ACTIONS: true

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./publish
          format: spdx-json
          output-file: publish/sbom.spdx.json

      - name: Compress Release Artifacts
        uses: thedoctor0/zip-release@0.7.6
        with:
          type: "zip"
          filename: ../ContainerExtension_${{steps.get-version.outputs.version}}_all.zip
          directory: ./publish

      - name: Generate SLSA Build Provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: ContainerExtension_${{steps.get-version.outputs.version}}_all.zip

      - name: Publish to GitHub Release
        uses: ncipollo/release-action@v1.14.0
        with:
          artifacts: "ContainerExtension_${{steps.get-version.outputs.version}}_all.zip,./publish/compatibility.txt,./publish/sbom.spdx.json"
          tag: ${{steps.get-version.outputs.version}}
          allowUpdates: true
