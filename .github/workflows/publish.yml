name: Publish Secure Release

on:
  workflow_dispatch:
  release:
    types:
      - published

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write      # Required for OIDC artifact attestation (SLSA)
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@39582172f897db67f6229396b75e31f030f57573 # v4.2.0
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/global.json', '**/Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Get Version
        uses: kzrnm/get-net-sdk-project-versions-action@de7fb293c126ec6b95d9ba65f377c8e96bf710d2 # v1.3.0
        id: get-version
        with:
          proj-path: src/ContainerExtension/ContainerExtension.csproj

      - name: Build Release Bundle
        run: dotnet build src/ContainerExtension/ContainerExtension.csproj -c Release -o publish -warnaserror
        env:
          GITHUB_ACTIONS: true

      - name: Generate SBOM
        uses: anchore/sbom-action@f32e10fe7735aeaa2221f986fe7487f940b5fa8c # v0.17.9
        with:
          path: ./publish
          format: spdx-json
          output-file: publish/sbom.spdx.json

      - name: Compress Release Artifacts
        uses: thedoctor0/zip-release@a340cc58dbfb4226d83cf803d41e8c75ab3f48a8 # v0.7.6
        with:
          type: "zip"
          filename: ../ContainerExtension_${{steps.get-version.outputs.version}}_all.zip
          directory: ./publish

      - name: Generate SLSA Build Provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v1.4.3
        with:
          subject-path: ContainerExtension_${{steps.get-version.outputs.version}}_all.zip

      - name: Publish to GitHub Release
        uses: ncipollo/release-action@2b85e0fe55fa16a75f14e59f42777174db62c8e3 # v1.14.0
        with:
          artifacts: "ContainerExtension_${{steps.get-version.outputs.version}}_all.zip,./publish/compatibility.txt,./publish/sbom.spdx.json"
          tag: ${{steps.get-version.outputs.version}}
          allowUpdates: true
