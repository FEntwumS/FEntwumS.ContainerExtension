name: .NET Secure Build, Test & Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write # Required for CodeQL
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-scan:
    runs-on: ubuntu-latest
    name: Build, Test & Scan
    timeout-minutes: 20

    steps:
    - name: Checkout Code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@39582172f897db67f6229396b75e31f030f57573 # v4.2.0
      with:
        dotnet-version: '10.0.x'

    - name: Initialize CodeQL
      uses: github/codeql-action/init@b56ba49b26e50535fa1e7f7db0f4db7b427ef03b # v3.28.10
      with:
        languages: csharp

    - name: Cache NuGet packages
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/global.json', '**/Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj') }}
        restore-keys: ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore OneWare.ContainerExtension.slnx

    - name: Verify Formatting
      run: dotnet format OneWare.ContainerExtension.slnx --verify-no-changes --no-restore

    - name: Build (Deterministic Mode)
      run: dotnet build OneWare.ContainerExtension.slnx --no-restore -warnaserror -c Release
      env:
        GITHUB_ACTIONS: true

    - name: Test
      run: dotnet test OneWare.ContainerExtension.slnx --no-build --verbosity normal -warnaserror -c Release

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@b56ba49b26e50535fa1e7f7db0f4db7b427ef03b # v3.28.10
      with:
        category: "/language:csharp"
