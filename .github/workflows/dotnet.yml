name: .NET Secure Build, Test & Scan

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore OneWare.ContainerExtension.slnx
      - name: Verify formatting
        run: dotnet format OneWare.ContainerExtension.slnx --verify-no-changes --no-restore

  build-test:
    name: Build & Test (${{ matrix.os }})
    needs: format
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/global.json', '**/Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj', '**/packages.lock.json') }}
          restore-keys: ${{ runner.os }}-nuget-
      # Restore is performed by the build below in locked mode (RestoreLockedMode=true), so a
      # drifted transitive dependency vs the committed packages.lock.json fails the build. The
      # ILLink trim-analysis package is part of the build-time graph, so locked-mode is enforced
      # through the build command rather than a standalone restore (which omits it).
      - name: Build (locked restore, deterministic, warnings as errors)
        run: dotnet build OneWare.ContainerExtension.slnx -c Release -warnaserror -p:RestoreLockedMode=true
        env:
          GITHUB_ACTIONS: true
      - name: Test
        run: dotnet test OneWare.ContainerExtension.slnx --no-build --verbosity normal -warnaserror -c Release
        env:
          GITHUB_ACTIONS: true

  codeql:
    name: CodeQL
    needs: format
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with:
          languages: csharp
      - name: Build for analysis
        run: dotnet build OneWare.ContainerExtension.slnx -c Release -p:RestoreLockedMode=true
        env:
          GITHUB_ACTIONS: true
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        # SARIF upload requires GitHub Advanced Security, which is unavailable on
        # this private repository; tolerate the rejected upload so the scan stays
        # informational rather than failing the workflow. Enabling code scanning
        # (or making the repository public) restores the upload.
        continue-on-error: true
        with:
          category: "/language:csharp"
