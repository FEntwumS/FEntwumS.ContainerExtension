name: .NET Secure Build, Test & Scan

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  contents: read
  security-events: write # Required for CodeQL
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-scan:
    runs-on: ubuntu-26.04
    name: Build, Test & Scan
    timeout-minutes: 20

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: csharp

    - name: Cache NuGet packages
      uses: actions/cache@v5
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/global.json', '**/Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj') }}
        restore-keys: ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore OneWare.ContainerExtension.slnx

    - name: Verify Formatting
      run: dotnet format OneWare.ContainerExtension.slnx --verify-no-changes --no-restore

    - name: Build (Deterministic Mode)
      run: dotnet build OneWare.ContainerExtension.slnx --no-restore -warnaserror -c Release
      env:
        GITHUB_ACTIONS: true

    - name: Test
      run: dotnet test OneWare.ContainerExtension.slnx --no-build --verbosity normal -warnaserror -c Release

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:csharp"
