name: Docker Build, Test & Scan

on:
  push:
    branches: [ "main", "dev" ]
    paths:
      - 'docker/**'
      - '.github/workflows/docker-build.yml'
  pull_request:
    branches: [ "main", "dev" ]
    paths:
      - 'docker/**'
      - '.github/workflows/docker-build.yml'
  schedule:
    # Run weekly on Sunday midnight to scan daily upstream releases
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: Build & Scan Container
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and Load
      uses: docker/build-push-action@v6
      with:
        context: ./docker/oss-cad-suite
        platforms: linux/amd64
        tags: |
          fentwums/oss-cad-suite:latest
          fentwums/oss-cad-suite:2026-06-26
        build-args: |
          RELEASE_TAG=2026-06-26
          RELEASE_DATE=20260626
          ARCH=linux-x64
          OSS_CAD_SUITE_SHA256=091122431af82e0229ee693e1a126096cb88ba8979896a586518af957ae68cf0
        load: true
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
      with:
        image-ref: 'fentwums/oss-cad-suite:latest'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'HIGH,CRITICAL'
        # Gate the build on FIXABLE HIGH/CRITICAL only: ignore-unfixed avoids red CI on unfixable
        # upstream base-image CVEs in a large toolchain image, while still failing on vulnerabilities
        # the maintainer can actually remediate. The allowlist in .trivyignore suppresses fixable
        # HIGH advisories inherited from the vendored upstream toolchain (base OS, bundled Python and
        # the `pebble` Go binary); the gate stays fail-closed on any CRITICAL or any new HIGH.
        exit-code: '1'
        ignore-unfixed: true
        trivyignores: '.trivyignore'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v4
      # always() so the SARIF still reaches the Security tab even when the scan gate above trips.
      if: always()
      continue-on-error: true
      with:
        sarif_file: 'trivy-results.sarif'
        category: 'trivy'
