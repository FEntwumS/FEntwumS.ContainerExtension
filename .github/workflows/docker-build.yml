name: Docker Build, Test & Scan

on:
  push:
    branches: [ "main", "dev" ]
    paths:
      - 'docker/**'
      - '.github/workflows/docker-build.yml'
  pull_request:
    branches: [ "main", "dev" ]
    paths:
      - 'docker/**'
      - '.github/workflows/docker-build.yml'
  schedule:
    # Run weekly on Sunday midnight to scan daily upstream releases
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: Build & Scan Container
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false

    - name: Set up QEMU
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

    # The 7 GB toolchain image, its build cache, and Trivy's image export together exceed the runner's
    # default free disk. Reclaim space from preinstalled toolchains this job does not use.
    - name: Free up runner disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        df -h /

    - name: Build and Load
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: ./docker/oss-cad-suite
        platforms: linux/amd64
        tags: |
          fentwums/oss-cad-suite:latest
          fentwums/oss-cad-suite:2026-07-15
        # Release tag/date/arch and the tarball SHA-256 are pinned once, as ARG defaults in the
        # Dockerfile, which is the single source of truth for the toolchain provenance. Do not
        # duplicate them here.
        load: true
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # Scan once to JSON. A single image export keeps the 7 GB toolchain image within the runner's disk
    # budget (two exports previously exhausted /tmp). exit-code 0 so findings never fail this step;
    # the next step both reports them and applies the gate.
    - name: Trivy scan (fixable HIGH/CRITICAL)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: 'fentwums/oss-cad-suite:latest'
        format: 'json'
        output: 'trivy.json'
        severity: 'HIGH,CRITICAL'
        ignore-unfixed: true
        exit-code: '0'

    # Surface every finding in the job log, readable without opening the Security tab, then fail closed
    # only on a fixable CRITICAL. The fixable-HIGH surface is inherited from
    # the vendored upstream toolchain (base OS, bundled Python, the `pebble` Go binary), which this
    # extension does not own (tool distribution is a documented non-goal); it is surfaced, not gated.
    - name: Report findings and gate on fixable CRITICAL
      run: |
        echo "### Fixable HIGH/CRITICAL by severity"
        jq -r '[.Results[]?.Vulnerabilities[]?] | group_by(.Severity)[] | "\(.[0].Severity): \(length)"' trivy.json || true
        echo "### Findings"
        jq -r '.Results[]?.Vulnerabilities[]? | "\(.Severity)\t\(.VulnerabilityID)\t\(.PkgName) \(.InstalledVersion) -> \(.FixedVersion)"' trivy.json | sort -u || true
        crit=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy.json)
        echo "Fixable CRITICAL count: ${crit}"
        if [ "${crit}" -gt 0 ]; then
          echo "::error::Build failed: ${crit} fixable CRITICAL vulnerability(ies) present in the image."
          exit 1
        fi
