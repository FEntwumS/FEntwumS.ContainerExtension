name: Docker Build, Test & Scan

on:
  push:
    branches: [ "main", "dev" ]
    paths:
      - 'docker/**'
      - '.github/workflows/docker-build.yml'
  pull_request:
    branches: [ "main", "dev" ]
    paths:
      - 'docker/**'
      - '.github/workflows/docker-build.yml'
  schedule:
    # Run weekly on Sunday midnight to scan daily upstream releases
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: Build & Scan Container
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
    - name: Checkout Code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      with:
        submodules: recursive

    - name: Set up QEMU
      uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    # The 7 GB toolchain image, its build cache, and Trivy's image export together exceed the runner's
    # default free disk. Reclaim space from preinstalled toolchains this job does not use.
    - name: Free up runner disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        df -h /

    - name: Build and Load
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
      with:
        context: ./docker/oss-cad-suite
        platforms: linux/amd64
        tags: |
          fentwums/oss-cad-suite:latest
          fentwums/oss-cad-suite:2026-06-26
        build-args: |
          RELEASE_TAG=2026-06-26
          RELEASE_DATE=20260626
          ARCH=linux-x64
          OSS_CAD_SUITE_SHA256=091122431af82e0229ee693e1a126096cb88ba8979896a586518af957ae68cf0
        load: true
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # Scan once to JSON. A single image export keeps the 7 GB toolchain image within the runner's disk
    # budget (two exports previously exhausted /tmp). exit-code 0 so findings never fail this step;
    # the next step both reports them and applies the gate.
    - name: Trivy scan (fixable HIGH/CRITICAL)
      uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
      with:
        image-ref: 'fentwums/oss-cad-suite:latest'
        format: 'json'
        output: 'trivy.json'
        severity: 'HIGH,CRITICAL'
        ignore-unfixed: true
        exit-code: '0'

    # Surface every finding in the job log (visible without Advanced Security, which this private repo
    # lacks), then fail closed only on a fixable CRITICAL. The fixable-HIGH surface is inherited from
    # the vendored upstream toolchain (base OS, bundled Python, the `pebble` Go binary), which this
    # extension does not own (tool distribution is a documented non-goal); it is surfaced, not gated.
    - name: Report findings and gate on fixable CRITICAL
      run: |
        echo "### Fixable HIGH/CRITICAL by severity"
        jq -r '[.Results[]?.Vulnerabilities[]?] | group_by(.Severity)[] | "\(.[0].Severity): \(length)"' trivy.json || true
        echo "### Findings"
        jq -r '.Results[]?.Vulnerabilities[]? | "\(.Severity)\t\(.VulnerabilityID)\t\(.PkgName) \(.InstalledVersion) -> \(.FixedVersion)"' trivy.json | sort -u || true
        crit=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy.json)
        echo "Fixable CRITICAL count: ${crit}"
        if [ "${crit}" -gt 0 ]; then
          echo "::error::Build failed: ${crit} fixable CRITICAL vulnerability(ies) present in the image."
          exit 1
        fi
