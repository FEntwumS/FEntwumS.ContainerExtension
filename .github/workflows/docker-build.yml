name: Docker Build, Test & Scan

on:
  push:
    branches: [ "main", "dev" ]
    paths:
      - 'docker/**'
      - '.github/workflows/docker-build.yml'
  pull_request:
    branches: [ "main", "dev" ]
    paths:
      - 'docker/**'
      - '.github/workflows/docker-build.yml'
  schedule:
    # Run weekly on Sunday midnight to scan daily upstream releases
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: Build & Scan Container
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and Load
      uses: docker/build-push-action@v6
      with:
        context: ./docker/oss-cad-suite
        platforms: linux/amd64
        tags: |
          fentwums/oss-cad-suite:latest
          fentwums/oss-cad-suite:2026-06-20
        build-args: |
          RELEASE_TAG=2026-06-20
          RELEASE_DATE=20260620
          ARCH=linux-x64
        load: true
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'fentwums/oss-cad-suite:latest'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'HIGH,CRITICAL'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v4
      continue-on-error: true
      with:
        sarif_file: 'trivy-results.sarif'
        category: 'trivy'
