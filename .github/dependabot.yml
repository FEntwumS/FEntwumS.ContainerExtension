version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      nuget-dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "nuget"
      - "security"
    commit-message:
      prefix: "deps(nuget)"
    ignore:
      # Runtime dependencies shared with — and provided by — the OneWare host. The plugin loader
      # rejects a plugin that requires a newer version than the host bundles, so these must be pinned
      # manually to match the targeted OneWare version and never auto-bumped (a bump compiles and tests
      # green but breaks plugin loading at runtime; see Directory.Packages.props).
      - dependency-name: "OneWare.Essentials"
      - dependency-name: "Avalonia"
      - dependency-name: "Avalonia.Themes.Fluent"
      - dependency-name: "System.IO.Pipelines"
      - dependency-name: "Microsoft.Extensions.DependencyInjection"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      actions-dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "ci"
      - "security"
    commit-message:
      prefix: "deps(actions)"

  - package-ecosystem: "docker"
    directory: "/docker/oss-cad-suite"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      docker-dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "docker"
      - "security"
    commit-message:
      prefix: "deps(docker)"
